# Publish a release to CurseForge: build the pack from this commit, upload the modpack zip with the patch notes,
# then attach the server pack to it. Run it by hand (Actions -> Publish to CurseForge -> Run workflow) once the
# release is tested. The API token comes from a repository secret; it is never printed.
name: Publish to CurseForge

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: Patch notes (markdown file in the repo)
        required: true
        default: marketing/changelog/latest.md
      release_type:
        description: alpha, beta or release
        required: true
        default: beta

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Build the modpack and the server pack
        run: python3 tools/build_pack.py --export
      - name: Upload to CurseForge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CURSEFORGE_API_TOKEN || secrets.CURSEFORGE_TOKEN || secrets.CF_TOKEN || secrets.CF_API_KEY || secrets.CURSEFORGE_API_KEY || secrets.CURSEFORGE_KEY }}
          CHANGELOG: ${{ inputs.changelog }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "No CurseForge token secret found (expected CF_API_TOKEN or CURSEFORGE_API_TOKEN)." >&2
            exit 1
          fi
          python3 tools/publish_cf.py --project 1772691 --changelog "$CHANGELOG" --release-type "$RELEASE_TYPE"
