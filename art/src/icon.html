<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Remnants S1 icon (the CurseForge project avatar): an Ashborn's greatsword planted in a mound of ash blocks before the
     black sun, the broken Sun-Crown fallen at its foot, embers rising, the name under it in a gold frame.
     1024x1024 vector; art/render.cjs writes out/icon_1024.png and out/icon.png (512). #notext drops the name.
     Fonts: SIL OFL (art/fonts). -->
<style>
  @font-face { font-family: "Cinzel Decorative"; font-weight: 900; src: url("../fonts/CinzelDecorative-Black.ttf"); }
  @font-face { font-family: "Cinzel"; font-weight: 400 900; src: url("../fonts/Cinzel-wght.ttf"); }
  html, body { margin: 0; background: #000; }
  #icon { position: relative; width: 1024px; height: 1024px; overflow: hidden; background: #040304; }
  #icon svg { position: absolute; inset: 0; }
  .name { position: absolute; left: 0; right: 0; top: 806px; text-align: center; font-family: "Cinzel Decorative"; font-weight: 900;
          font-size: 126px; line-height: 1; letter-spacing: 4px; margin-right: -4px; color: transparent;
          background: linear-gradient(180deg, #fff6d8 6%, #f7d27a 34%, #d9a03a 60%, #8a5a14 92%); -webkit-background-clip: text; background-clip: text;
          -webkit-text-stroke: 2.5px #241404;
          filter: drop-shadow(0 4px 0 #0e0702) drop-shadow(0 10px 16px rgba(0,0,0,.95)) drop-shadow(0 0 26px rgba(255,140,40,.4)); }
  .rule { position: absolute; left: 0; right: 0; top: 938px; display: flex; align-items: center; justify-content: center; gap: 16px; }
  .rule i { display: block; width: 150px; height: 2px; }
  .rule i:first-child { background: linear-gradient(90deg, transparent, #e8b85a); }
  .rule i:last-child { background: linear-gradient(90deg, #e8b85a, transparent); }
  .rule b { display: block; width: 11px; height: 11px; background: #f2c45a; transform: rotate(45deg); box-shadow: 0 0 10px rgba(255,150,50,.9); }
  .sub { position: absolute; left: 0; right: 0; top: 951px; text-align: center; font-family: Cinzel; font-weight: 700; font-size: 27px;
         letter-spacing: 15px; margin-right: -15px; color: #eedcb2; text-shadow: 0 2px 0 #120a03, 0 3px 10px #000; }
  body.notext .name, body.notext .rule, body.notext .sub { display: none; }
</style>
</head>

      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .2  0 0 0 0 .13  0 0 0 0 .11  0 0 0 1.7 -.62" result="f"/>

    </filter>

  <!-- sky, corona, the black sun -->

    <path id="blade" d="M474 318 L550 318 L549 420 L553 427 L547 434 L545 560 L543 700 L542 796 L482 796 L482 700 L480 612 L474 605 L480 598 L477 470 Z"

    <rect x="507" y="334" width="9" height="400" fill="#0e0c0b" opacity=".9"/>

    <path d="M-61 -62 L-55 -30 M-24 -82 L-20 -36 M30 -78 L28 -34 M62 -60 L57 -28" stroke="#f4dca0" stroke-width="1.6" opacity=".55"/>

    <rect x="-72" y="-8" width="144" height="30" fill="#000" filter="url(#grime)" opacity=".9"/>

<script>
  if (location.hash.includes('notext')) document.body.classList.add('notext');
  const NS = 'http://www.w3.org/2000/svg';
  const el = (parent, tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]);
                                      document.getElementById(parent).appendChild(e); return e; };
  let s = 20261029; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const CX = 512, CY = 372, R = 158;

  // corona: thin rays of every length, a few long streamers, all bent by the wisp filter
  for (let i = 0; i < 300; i++) {
    const a = rnd() * Math.PI * 2, inner = i < 110, len = inner ? R + 6 + rnd() * 60 : R + 10 + Math.pow(rnd(), 1.7) * 290,
          w = inner ? 1.5 + rnd() * 3 : 0.8 + rnd() * 2.6;
    const tx = -Math.sin(a), ty = Math.cos(a), c = Math.cos(a), sn = Math.sin(a), r0 = R - 4;
    const pts = [[CX + c * r0 + tx * w, CY + sn * r0 + ty * w], [CX + c * len, CY + sn * len], [CX + c * r0 - tx * w, CY + sn * r0 - ty * w]];
    el('rays', 'polygon', { points: pts.map(p => p.join(',')).join(' '), fill: rnd() < 0.25 ? '#fff0cc' : '#ffbf6a',
                            opacity: (inner ? 0.3 + rnd() * 0.45 : 0.06 + rnd() * 0.3).toFixed(2) });
  }
  for (const [deg, len, w] of [[-8, 330, 34], [172, 320, 30], [-95, 250, 22], [62, 280, 26], [208, 260, 24], [128, 230, 20], [-48, 240, 18]]) {
    const a = deg * Math.PI / 180, c = Math.cos(a), sn = Math.sin(a), tx = -sn, ty = c, r0 = R;
    const pts = [[CX + c * r0 + tx * w, CY + sn * r0 + ty * w], [CX + c * len, CY + sn * len], [CX + c * r0 - tx * w, CY + sn * r0 - ty * w]];
    el('streamers', 'polygon', { points: pts.map(p => p.join(',')).join(' '), fill: '#ffb766', opacity: '.32' });
  }

  // the bead: the last light on the rim, with a four-point flare
  { const a = -62 * Math.PI / 180, bx = CX + Math.cos(a) * (R + 1), by = CY + Math.sin(a) * (R + 1);
    el('bead', 'circle', { cx: bx, cy: by, r: 70, fill: '#ffc060', opacity: '.45', filter: 'url(#b28)' });
    el('bead', 'circle', { cx: bx, cy: by, r: 26, fill: '#fff2c8', opacity: '.95', filter: 'url(#b12)' });
    el('bead', 'path', { d: `M${bx - 150} ${by} L${bx + 150} ${by} M${bx} ${by - 95} L${bx} ${by + 95}`, stroke: '#fff6dc', 'stroke-width': 3, opacity: '.8', filter: 'url(#b2)' });
    el('bead', 'circle', { cx: bx, cy: by, r: 8, fill: '#ffffff' }); }

  // ruins: towers (some spired, some broken) and low walls, dark against the glow, half lost in the smoke
  for (const [x0, parts] of [[44, [['t', 30, 150, 's'], ['w', 46, 64], ['t', 38, 214, 'b'], ['w', 54, 52], ['t', 26, 128, 's'], ['w', 40, 40]]],
                             [702, [['w', 34, 46], ['t', 28, 132, 's'], ['w', 40, 70], ['t', 40, 248, 's'], ['w', 50, 58], ['t', 30, 168, 'b'], ['w', 40, 44]]]]) {
    let x = x0, d = `M${x} 800`;
    for (const [k, w, h, roof] of parts) {
      const y = 790 - h;
      if (k === 'w') {   // a wall with a broken, stepped top
        d += ` L${x} ${y} L${x + w * 0.3} ${y} L${x + w * 0.3} ${y + 8} L${x + w * 0.6} ${y + 8} L${x + w * 0.6} ${y - 4} L${x + w} ${y - 4}`;
      } else if (roof === 's') {   // a spire, with a slit window
        d += ` L${x} ${y} L${x - 4} ${y} L${x + w / 2} ${y - h * 0.42} L${x + w + 4} ${y} L${x + w} ${y}`;
        el('ruins', 'rect', { x: x + w / 2 - 2.5, y: y + 26, width: 5, height: 14, fill: '#ff8a3a', opacity: '.35' });
      } else {   // a broken tower top
        d += ` L${x} ${y + 6} L${x + w * 0.25} ${y - 10} L${x + w * 0.45} ${y + 4} L${x + w * 0.7} ${y - 18} L${x + w} ${y + 10}`;
      }
      x += w;
    }
    d += ` L${x} 800 Z`;
    el('ruins', 'path', { d, fill: '#070404' });
  }

  // linen wrap on the grip
  for (let y = 154; y < 280; y += 13) {
    el('wrap', 'path', { d: `M497 ${y + 8} L527 ${y} L527 ${y + 7} L497 ${y + 15} Z`, fill: '#76664f', stroke: '#1a110a', 'stroke-width': 1.4 });
    el('wrap', 'path', { d: `M497 ${y + 8} L527 ${y}`, stroke: '#d9c49a', 'stroke-width': 1, opacity: '.45' });
  }

  // the mound: columns of ash blocks (32 px), half-block steps, peaking at the sword
  const topY = x => Math.round((806 - 66 * Math.exp(-Math.pow((x - CX) / 210, 2))) / 16) * 16;
  let d = 'M0 1024';
  const cols = [];
  for (let x = 0; x < 1024; x += 32) { const y = topY(x + 16); cols.push([x, y]); d += ` L${x} ${y} L${x + 32} ${y}`; }
  d += ' L1024 1024 Z';
  el('mound', 'path', { d, fill: 'url(#ground)' });
  cols.forEach(([x, y], i) => {
    const near = Math.exp(-Math.pow((x + 16 - CX) / 190, 2));
    el('mound', 'path', { d: `M${x} ${y} L${x + 32} ${y}`, stroke: '#ffae5a', 'stroke-width': 2.5, opacity: (0.18 + 0.7 * near).toFixed(2) });
    const prev = cols[i - 1];
    if (prev && prev[1] !== y) { const yy = Math.min(prev[1], y), y2 = Math.max(prev[1], y);
      el('mound', 'path', { d: `M${x} ${yy} L${x} ${y2}`, stroke: '#ff9a4a', 'stroke-width': 2, opacity: (0.12 + 0.5 * near).toFixed(2) }); }
    // block seams under the top face
    for (let yy = y + 32; yy < 1024; yy += 32) el('mound', 'path', { d: `M${x} ${yy} L${x + 32} ${yy} M${x} ${yy - 32} L${x} ${yy}`,
      stroke: '#000', 'stroke-width': 1.5, opacity: '.35' });
  });
  // ember light in the seams between the ash blocks near the blade's foot
  for (let i = 0; i < 16; i++) {
    const x = Math.round((CX + (rnd() - 0.5) * 340) / 32) * 32, y0 = topY(x + 16), y = y0 + 32 * Math.floor(rnd() * 2) + 32;
    const vertical = rnd() < 0.45, len = 12 + rnd() * 20, near = Math.exp(-Math.pow((x - CX) / 160, 2));
    const d = vertical ? `M${x} ${y - len} L${x} ${y}` : `M${x} ${y} L${x + len} ${y}`;
    el('cracks', 'path', { d, stroke: '#ff6a14', 'stroke-width': 7, opacity: (0.35 * near + 0.1).toFixed(2), filter: 'url(#b5)' });
    el('cracks', 'path', { d, stroke: '#ffc070', 'stroke-width': 1.8, opacity: (0.7 * near + 0.15).toFixed(2) });
  }

  // embers rising from the foot of the sword, thinning as they climb; ash flakes everywhere
  for (let i = 0; i < 110; i++) {
    const u = Math.pow(rnd(), 1.15), y = 772 - u * 600, spread = 90 + u * 330, x = CX + (rnd() + rnd() - 1) * spread;
    const r = (1 + rnd() * 3.4) * (1 - u * 0.4), a = (0.95 - u * 0.6) * (0.5 + rnd() * 0.5), tilt = (rnd() - 0.5) * 30;
    const col = rnd() < 0.5 ? '#ffb347' : '#ff7424';
    el('embers', 'ellipse', { cx: x, cy: y, rx: r * 2.4, ry: r * 4.2, fill: col, opacity: (a * 0.5).toFixed(2), filter: 'url(#b5)',
                              transform: `rotate(${tilt} ${x} ${y})` });
    el('embers', 'ellipse', { cx: x, cy: y, rx: r * 0.8, ry: r * 1.6, fill: '#fff0c4', opacity: a.toFixed(2), transform: `rotate(${tilt} ${x} ${y})` });
  }
  for (let i = 0; i < 50; i++) el('embers', 'circle', { cx: rnd() * 1024, cy: 60 + rnd() * 760, r: 0.8 + rnd() * 1.6, fill: '#cbbfb2',
                                                        opacity: (0.12 + rnd() * 0.25).toFixed(2) });

  // frame corners: an L of two rules and a diamond, and a diamond at the top centre
  for (const [x, y, sx, sy] of [[32, 32, 1, 1], [992, 32, -1, 1], [32, 992, 1, -1], [992, 992, -1, -1]]) {
    el('corners', 'path', { d: `M${x + sx * 14} ${y + sy * 84} L${x + sx * 14} ${y + sy * 14} L${x + sx * 84} ${y + sy * 14}`,
                            fill: 'none', stroke: '#e8b85a', 'stroke-width': 2, opacity: '.85' });
    el('corners', 'path', { d: `M${x} ${y - 13} L${x + 13} ${y} L${x} ${y + 13} L${x - 13} ${y} Z`, fill: '#f2c45a', stroke: '#2a1806', 'stroke-width': 2 });
  }
  el('corners', 'path', { d: 'M512 21 L525 32 L512 43 L499 32 Z', fill: '#f2c45a', stroke: '#2a1806', 'stroke-width': 2 });
</script>
