# curve). Bags pay in the pack's own economy: runes (Faded 200 / Lustrous 1k / Radiant 4k / Hero's 12k / Sovereign
# 40k), tempering and lustrous stones, whetstones, Remnant Shards, tomes and food.
# tools/build_data.py writes kubejs/data/mob_loot_bags/loot_table/bags/. Entries: [item, weight, min, max].

