chapter: h_vaults
group: hearth
order: 34
title: "&aThe Vaults"
subtitle: "Two kinds of storage, one ladder. Each rung needs the other. Then OmniVault keeps climbing."
icon: omnivault:crafting_terminal
quests:
  # ---- Tier I: a sack becomes a backpack, a barrel becomes a drawer ----
  - key: backpack
    title: "Everything You Own, Carried"
    subtitle: "A sack, grown up."
    icon: sophisticatedbackpacks:backpack
    pos: [0, -2.5]
    deps: [h_lastlight/sack, s1_forge/ashen_alloy]
    shape: hexagon
    size: 1.25
    desc: |
      A &6Backpack&r starts as a Supplementaries &6Sack&r: sew it into leather and string with two &6Ashen Alloy&r. Carry it, wear it or set it down; it keeps everything inside either way.

      &7When you die, your items wait in your corpse. A backpack is one item. Think about that.
    tasks: [{item: sophisticatedbackpacks:backpack}]
    rewards: [{item: minecraft:leather, count: 8}, {xp: 60}]

  - key: chest
    title: "Chests That Grow"
    subtitle: "The larder outgrew the larder."
    icon: sophisticatedstorage:iron_chest
    pos: [0, 0]
    deps: [h_lastlight/home, s1_forge/ashen_alloy]
    shape: hexagon
    size: 1.25
    desc: |
      A &6Sophisticated Chest&r is planks around a lever. Ring it with &6Ashen Alloy&r for an &6Iron Chest&r, or put a &6Tier Upgrade&r on a placed chest to grow it where it stands. Barrels work the same way.

      In this pack the storage tiers follow the Ember Forge: &fcopper&r is Create copper sheets, &firon&r is Ashen Alloy, &6gold&r Duskforged, &bdiamond&r Moonsilver, &8netherite&r Deepsteel.
    tasks: [{item: sophisticatedstorage:iron_chest}]
    rewards: [{item: remnants:ashen_alloy, count: 4}, {xp: 60}]

  - key: drawers
    title: "A Drawer for Everything"
    subtitle: "Built on a Sophisticated barrel."
    icon: omnivault:drawer_1x1
    pos: [2, 1.75]
    deps: [chest]
    desc: |
      An OmniVault &6Drawer&r holds a great many of one item and shows it on its face. Its frame is a &6Sophisticated Barrel&r, planks and iron nuggets: the two vaults start sharing parts here and never stop.
    tasks: [{item: omnivault:drawer_1x1}]
    rewards: [{item: minecraft:iron_nugget, count: 18}, {xp: 50}]

  - key: upgrades
    title: "Upgrades"
    subtitle: "A bag that bends over so you don't have to."
    icon: sophisticatedbackpacks:pickup_upgrade
    pos: [2, -3.25]
    deps: [backpack]
    desc: |
      Every upgrade starts as an &6Upgrade Base&r: Ashen Alloy, leather and string. A &6Pickup Upgrade&r scoops loot into the pack as you walk; set its filter so it leaves the rotten flesh where it fell.

      Magnet, smelting, compacting, void, feeding, tool swapper: JEI has every recipe.
    tasks: [{item: sophisticatedbackpacks:pickup_upgrade}]
    rewards: [{item: sophisticatedbackpacks:upgrade_base, count: 2}, {xp: 50}]

  - key: crafting_upgrade
    title: "A Table on Your Back"
    subtitle: "Craft where you stand."
    icon: sophisticatedbackpacks:crafting_upgrade
    pos: [4, -3.25]
    deps: [upgrades]
    desc: |
      A &6Crafting Upgrade&r puts a crafting grid in the backpack. Keep one spare: OmniVault's &6Crafting Terminal&r is built around one.
    tasks: [{item: sophisticatedbackpacks:crafting_upgrade}]
    rewards: [{xp: 50}]

  - key: backpack_iron
    title: "Iron-Bound"
    subtitle: "Bigger, and nothing falls out."
    icon: sophisticatedbackpacks:iron_backpack
    pos: [2, -1.75]
    deps: [backpack]
    desc: |
      Ring a backpack with &6Ashen Alloy&r (or Create copper sheets for copper first) and it grows with everything still inside. Each tier holds more and fits more upgrades.
    tasks: [{item: sophisticatedbackpacks:iron_backpack}]
    rewards: [{item: remnants:ashen_alloy, count: 4}, {xp: 60}]

  # ---- Tier II: the Logic Processor joins the two ----
  - key: logic
    title: "&eThe Logic Processor"
    subtitle: "Omnium, Duskforged and redstone."
    icon: omnivault:logic_processor
    pos: [4, 1.75]
    deps: [drawers, s1_forge/duskforged]
    shape: hexagon
    desc: |
      &6Omnium&r is amethyst, quartz and redstone ground to dust, blended with Ashen Alloy and smelted. No quartz before the Nether? Mix amethyst, redstone and a &6Remnant Shard&r in a Create basin instead.

      Omnium, &6Duskforged&r and redstone make a &6Logic Processor&r. Both vaults run on it: the Sophisticated &6Controller&r, every &6advanced&r upgrade, every OmniVault device.
    tasks: [{item: omnivault:logic_processor}]
    rewards: [{item: omnivault:omnium_ingot, count: 4}, {xp: 150}]

  - key: controller
    title: "One Room, Many Chests"
    subtitle: "A Sophisticated controller, thinking in OmniVault."
    icon: sophisticatedstorage:controller
    pos: [6, 0]
    deps: [chest, logic]
    desc: |
      A &6Storage Controller&r joins every Sophisticated chest and barrel touching it into one network. Its brain is now an OmniVault &6Logic Processor&r.
    tasks: [{item: sophisticatedstorage:controller}]
    rewards: [{xp: 100}]

  - key: hub
    title: "The Storage Hub"
    subtitle: "Every chest it touches becomes one."
    icon: omnivault:storage_hub
    pos: [6, 1.75]
    deps: [controller]
    desc: |
      An OmniVault &6Storage Hub&r is built around a Sophisticated &6Controller&r. It joins every chest, barrel, drawer and Sophisticated chest it touches; &6Inventory Cables&r carry it further.
    tasks: [{item: omnivault:storage_hub}]
    rewards: [{item: omnivault:inventory_cable, count: 8}, {xp: 100}]

  - key: terminal
    title: "&aThe Crafting Terminal"
    subtitle: "Every chest at once, and a table to work at."
    icon: omnivault:crafting_terminal
    pos: [8, 1.75]
    deps: [hub, crafting_upgrade]
    shape: hexagon
    desc: |
      A &6Terminal&r wired to your Storage Hub shows the whole network in one scrolling view: search by name, &e@mod&r or &e#tag&r. Add a Sophisticated &6Crafting Upgrade&r and redstone and it becomes a &6Crafting Terminal&r.

      &o"I've seen Sovereigns' treasuries kept worse."&r
    tasks: [{item: omnivault:crafting_terminal}]
    rewards: [{table: hearth_homestead}, {xp: 150}]

  - key: backpack_gold
    title: "Gilded at Dusk"
    subtitle: "Gold tier, Duskforged."
    icon: sophisticatedbackpacks:gold_backpack
    pos: [6, -1.75]
    deps: [backpack_iron, s1_forge/duskforged]
    desc: |
      The gold tier of every backpack, chest and barrel takes &6Duskforged Ingots&r. So does the gold &6Tier Upgrade&r.
    tasks: [{item: sophisticatedbackpacks:gold_backpack}]
    rewards: [{item: remnants:duskforged_ingot, count: 2}, {xp: 120}]

  - key: storage_link
    title: "Reaching Further"
    subtitle: "A chest across the room, still in the network."
    icon: sophisticatedstorage:storage_link
    pos: [8, 0]
    deps: [controller]
    desc: |
      A &6Storage Link&r carries a Sophisticated controller's network to chests that don't touch it. OmniVault's wireless terminal is built around one.
    tasks: [{item: sophisticatedstorage:storage_link}]
    rewards: [{xp: 80}]

  # ---- Tier III: Moonsilver ----
  - key: advanced_processor
    title: "&bThe Advanced Processor"
    subtitle: "Moonsilver thinks faster."
    icon: omnivault:advanced_processor
    pos: [10, 3.25]
    deps: [logic, s1_forge/moonsilver]
    shape: hexagon
    desc: |
      A Logic Processor, &6Moonsilver&r, quartz and Omnium. Crafting processors, pattern terminals, assemblers, wireless and the Nexus Core all need one.
    tasks: [{item: omnivault:advanced_processor}]
    rewards: [{item: remnants:moonsilver_ingot, count: 1}, {xp: 200}]

  - key: advanced_upgrade
    title: "Advanced Upgrades"
    subtitle: "Every upgrade, sharper."
    icon: sophisticatedbackpacks:advanced_pickup_upgrade
    pos: [8, -3.25]
    deps: [upgrades, logic, s1_forge/moonsilver]
    desc: |
      Every &6advanced&r Sophisticated upgrade takes Duskforged, Moonsilver and an OmniVault &6Logic Processor&r where the redstone used to be. Start with an &6Advanced Pickup Upgrade&r: filters, and it never picks up what you told it not to.
    tasks: [{item: sophisticatedbackpacks:advanced_pickup_upgrade}]
    rewards: [{item: omnivault:logic_processor, count: 2}, {xp: 200}]

  - key: backpack_diamond
    title: "Moonsilver Stitching"
    subtitle: "Diamond tier."
    icon: sophisticatedbackpacks:diamond_backpack
    pos: [10, -1.75]
    deps: [backpack_gold, s1_forge/moonsilver]
    desc: |
      Diamond-tier backpacks, chests and barrels take &6Moonsilver Ingots&r.
    tasks: [{item: sophisticatedbackpacks:diamond_backpack}]
    rewards: [{xp: 250}]

  - key: nexus
    title: "&dThe Nexus Core"
    subtitle: "Let the vault do the crafting."
    icon: omnivault:nexus_core
    pos: [12, 1.75]
    deps: [terminal, advanced_processor]
    shape: gear
    size: 1.25
    keeper: |
      The Crown's treasurers kept ledgers that wrote themselves. I thought it was sorcery. It was just very good bookkeeping.
    desc: |
      Advanced Processors, Omnium and an ender eye build a &6Nexus Core&r: the heart of a network with no channel limits, cells, wireless terminals and &6autocrafting&r.

      &7Encode a recipe in a &6Pattern Encoding Terminal&7, hand it to a &6Pattern Provider&7, let an &6Assembler&7 and a &6Crafting Processor&7 do the work, and ask the terminal for what you need. JEI's &e+&7 button loads any recipe into the encoder.
    tasks: [{item: omnivault:nexus_core}]
    rewards: [{table: hearth_homestead}, {item: omnivault:blank_pattern, count: 8}, {xp: 400}]

  - key: wireless
    title: "The Vault in Your Pocket"
    subtitle: "A Storage Link with a screen."
    icon: omnivault:wireless_terminal
    pos: [12, 0]
    deps: [storage_link, terminal, advanced_processor]
    desc: |
      A &6Wireless Terminal&r: a Crafting Terminal, an Advanced Processor, Omnium and a Sophisticated &6Storage Link&r. Reach the network from anywhere within a Wireless Transmitter's range.
    tasks: [{item: omnivault:wireless_terminal}]
    rewards: [{xp: 300}]

  # ---- Tier IV: Deepsteel ----
  - key: quantum
    title: "&3The Quantum Processor"
    subtitle: "Echoes, pearls and Deepsteel."
    icon: omnivault:quantum_processor
    pos: [14, 3.25]
    deps: [advanced_processor, s1_forge/deepsteel]
    shape: hexagon
    desc: |
      An Advanced Processor, &6Deepsteel&r, an echo shard and an ender pearl. The million-item cells, quantum links and the quantum wireless terminal start here.
    tasks: [{item: omnivault:quantum_processor}]
    rewards: [{item: remnants:deepsteel_ingot, count: 1}, {xp: 400}]

  - key: backpack_netherite
    title: "Deepsteel Seams"
    subtitle: "The last tier."
    icon: sophisticatedbackpacks:netherite_backpack
    pos: [14, -1.75]
    deps: [backpack_diamond, s1_forge/deepsteel]
    desc: |
      The netherite tier of backpacks, chests and barrels takes &6Deepsteel&r (and a netherite upgrade template at the smithing table). The highest stack upgrades take Deepsteel and Sunforged too.
    tasks: [{item: sophisticatedbackpacks:netherite_backpack}]
    rewards: [{xp: 400}]

  # ---- Tier VI: the Eclipse Core ----
  - key: omega
    title: "&6Without Limit"
    subtitle: "The omega stack upgrade."
    icon: sophisticatedbackpacks:stack_upgrade_omega_tier
    pos: [18, -1.75]
    deps: [backpack_netherite, s1_forge/eclipse_core]
    shape: gear
    size: 1.5
    desc: |
      A Tier 4 stack upgrade and an &5Eclipse Core&r. Every slot holds as much as you will ever own. The &6Everlasting&r and &6Inception&r upgrades want a core as well.
    tasks: [{item: sophisticatedbackpacks:stack_upgrade_omega_tier}]
    rewards: [{xp: 1000}]

  - key: quantum_wireless
    title: "&5Everywhere at Once"
    subtitle: "The quantum wireless terminal."
    icon: omnivault:quantum_wireless_terminal
    pos: [18, 1.75]
    deps: [quantum, wireless, s1_forge/eclipse_core]
    shape: gear
    size: 1.5
    desc: |
      Smith a Wireless Terminal with a &6Quantum Upgrade Template&r and an &5Eclipse Core&r: the network from any distance, in any dimension. Singularity cells, quantum bridges and the quantum assembler are built from cores too.
    tasks: [{item: omnivault:quantum_wireless_terminal}]
    rewards: [{table: sovereign_tribute}, {xp: 1000}]

  # =====================================================================================================
  # OmniVault, the whole of it: physical storage (left), the Nexus network (right), autocrafting, quantum.
  # =====================================================================================================

  # ---- Tier I: vaults and the bin ----
  - key: vault
    title: "Six Vaults"
    subtitle: "Copper to Omnium, one kit at a time."
    icon: omnivault:copper_vault
    pos: [-2, 0]
    deps: [chest, h_clockwork/press]
    desc: |
      OmniVault keeps its own chests: &6Vaults&r, with a lid on a hinge, a &eSort&r button and a comparator reading of how full they are. A &6Copper Vault&r is Create &6copper sheets&r around a Sophisticated Chest: forty-five slots.

      Iron (Ashen Alloy) holds 54, Gold (Duskforged) 81, Diamond (Moonsilver and glass) 108, Netherite (Deepsteel, at the smithing table) 135 and shrugs off explosions; Omnium, built on a Netherite Vault with an Advanced Processor, holds 162.

      &7A &6Vault Upgrade&7 kit raises a placed vault one tier and keeps its contents, name and facing; the Copper kit turns a plain chest or barrel into a Copper Vault. Build a Copper Vault.
    tasks: [{item: omnivault:copper_vault}]
    rewards: [{item: omnivault:iron_vault_kit}, {xp: 60}]

  - key: trash_can
    title: "Some Things Should Burn"
    subtitle: "What you can't carry, nobody gets."
    icon: omnivault:trash_can
    pos: [-2, 1.75]
    deps: [chest]
    optional: true
    desc: |
      The Ashen Company's rule on the march: what you can't carry, you burn. &o"Rotten flesh never won a war,"&r says the Captain.

      A &6Trash Can&r is Ashen Alloy and cobblestone around a lava bucket. Whatever goes in is gone, though the last thing you threw away can still be pulled back out. Its automation filter decides what hoppers and pipes may void: an allow-list or a deny-list.

      &7Build a Trash Can.
    tasks: [{item: omnivault:trash_can}]
    rewards: [{xp: 40}]

  # ---- Tier II: drawers that think, tools that move ----
  - key: compacting_drawer
    title: "Nine Nuggets, One Ingot"
    subtitle: "One drawer, three shapes of the same thing."
    icon: omnivault:compacting_drawer
    pos: [2, 3.5]
    deps: [drawers, logic]
    desc: |
      A &6Compacting Drawer&r holds an item, its block and its nuggets as one amount and hands out whichever shape you ask for. Pour in gold nuggets; take out ingots, or blocks.

      &7Ashen Alloy, two pistons, a Drawer and a Logic Processor. Build one.
    tasks: [{item: omnivault:compacting_drawer}]
    rewards: [{item: minecraft:gold_nugget, count: 27}, {xp: 80}]

  - key: drawer_upgrades
    title: "Deeper Drawers"
    subtitle: "Iron, gold, diamond, netherite: the Forge's four."
    icon: omnivault:iron_drawer_upgrade
    pos: [4, 3.5]
    deps: [drawers, logic]
    desc: |
      A drawer holds thirty-two stacks of one thing (sixteen per slot in a 1×2, eight in a 2×2). Capacity upgrades multiply that and add up: &fIron&r ×2 (Ashen Alloy), &6Gold&r ×4 (Duskforged), &bDiamond&r ×8 (Moonsilver), &8Netherite&r ×16 (Deepsteel). Each is built on the one before, starting from a &6Blank Upgrade Card&r: Ashen Alloy, Omnium, gold nuggets and a Logic Processor.

      A &6Void Drawer Upgrade&r destroys whatever no longer fits.

      &7Sneak-right-click a drawer with an empty hand for its upgrade screen. Make an Iron Drawer Upgrade.
    tasks: [{item: omnivault:iron_drawer_upgrade}]
    rewards: [{item: omnivault:upgrade_base, count: 2}, {xp: 80}]

  - key: drawer_controller
    title: "A Wall That Answers"
    subtitle: "Every drawer within twelve blocks, as one."
    icon: omnivault:drawer_controller
    pos: [3, 5.25]
    deps: [compacting_drawer, drawer_upgrades]
    desc: |
      A &6Drawer Controller&r joins every drawer within twelve blocks: touching it, touching each other, or joined by &6Drawer Trim&r. Hoppers, pipes and the vault network see the whole wall through it.

      A &6Drawer Key&r (Omnium, Ashen Alloy and a gold nugget) locks a drawer to its item, so an empty slot keeps a ghost of what belongs there. Use the key on the controller and the whole wall locks.

      &7Build a controller (Ashen Alloy, Omnium, comparators, a drawer, a Logic Processor), four trim and a key.
    tasks: [{item: omnivault:drawer_controller}, {item: omnivault:drawer_trim, count: 4}, {item: omnivault:drawer_key}]
    rewards: [{table: hearth_workshop}, {xp: 120}]

  - key: tools
    title: "Tools of the Trade"
    subtitle: "Turn it, take it apart, carry it off."
    icon: omnivault:relocator
    pos: [6, 3.5]
    deps: [logic]
    desc: |
      Last Light moves a room at a time. The &6OmniTool&r (Ashen Alloy and Omnium) turns and configures OmniVault blocks with a right-click and dismantles them with a sneak-right-click.

      The &6Relocator&r (slime, Ashen Alloy and a Logic Processor) picks up a chest, a furnace or another mod's machine with everything still inside, and sets it down somewhere else. Sixteen uses.

      &7Make both.
    tasks: [{item: omnivault:omni_tool}, {item: omnivault:relocator}]
    rewards: [{item: minecraft:slime_ball, count: 4}, {xp: 80}]

  - key: netherite_relocator
    title: "A Hand That Never Tires"
    subtitle: "Deepsteel at the smithing table."
    icon: omnivault:netherite_relocator
    pos: [7, 5.25]
    deps: [tools, s1_forge/deepsteel]
    optional: true
    desc: |
      Smith a Relocator with a &6netherite upgrade template&r and a &6Deepsteel Ingot&r: the &6Netherite Relocator&r never wears out.

      &7The templates still come from the bastions. Make one.
    tasks: [{item: omnivault:netherite_relocator}]
    rewards: [{xp: 300}]

  - key: linked_vault
    title: "The Same Box Everywhere"
    subtitle: "Three colours on a latch, one chest in every world."
    icon: omnivault:linked_vault
    pos: [5, 5.25]
    deps: [tools, s1_act4_ash/fortress]
    desc: |
      A &6Linked Vault&r is twenty-seven slots shared by every Linked Vault with the same three colours on its latches, in any world: blaze rods from Morgrath's forts, wool, obsidian, an ender chest and a Logic Processor. Dye the latches to pick a channel; a diamond or the &6OmniTool&r makes it yours alone.

      A &6Linked Pouch&r (leather, wool, an ender pearl, a Logic Processor) binds to a vault with a sneak-right-click and opens it from anywhere.

      &7Build a Linked Vault and a Linked Pouch.
    tasks: [{item: omnivault:linked_vault}, {item: omnivault:linked_pouch}]
    rewards: [{item: minecraft:ender_pearl, count: 2}, {xp: 300}]

  # ---- Tier III: the Nexus network ----
  - key: cell_drive
    title: "Cells and a Drive"
    subtitle: "Chests are for people."
    icon: omnivault:drive
    pos: [10.5, 5.25]
    deps: [nexus]
    desc: |
      A Nexus network keeps its own stores in &6storage cells&r: a &6Cell Housing&r (glass, redstone, Ashen Alloy) around a &6Storage Matrix&r. The 4K matrix is redstone, Omnium dust, quartz and a Logic Processor.

      A &6Cell Drive&r is ten bays built into two Sophisticated &6gold barrels&r, each bay with a light: green with room to spare, amber nearly full, red full. &6Nexus Cable&r joins it to the core.

      &7Build a Cell Drive and a 4K Storage Cell, and slot the cell in.
    tasks: [{item: omnivault:drive}, {item: omnivault:storage_cell_4k}]
    rewards: [{item: omnivault:omnium_dust, count: 8}, {xp: 200}]

  - key: network_port
    title: "Pipes Into the Vault"
    subtitle: "The Works pour; the network sorts."
    icon: omnivault:network_port
    pos: [9, 7]
    deps: [cell_drive, n_works/processing]
    desc: |
      The &6Ashen Works&r never stop: crushers, furnaces, a line of item pipes spilling ingots on the floor. A &6Network Port&r is the whole network as one inventory and one tank. Pipe into it and the network files everything; pipe out of it and the network pays.

      The vault needs no power of its own. The Works do.

      &7Ashen Alloy, a hopper, a chest, Omnium and a Logic Processor. Build a Network Port and run the Works' pipes into it.
    tasks: [{item: omnivault:network_port}]
    rewards: [{xp: 200}]

  - key: network_cells
    title: "&bRoom for Everything"
    subtitle: "Every cell is four of the last."
    icon: omnivault:storage_cell_64k
    pos: [10.5, 8.75]
    deps: [cell_drive, network_port]
    shape: hexagon
    size: 1.25
    desc: |
      Every matrix is four of the one before. Four 4K matrices, Duskforged and a Logic Processor make a &616K&r; four 16Ks, Moonsilver and an Advanced Processor a &b64K&r. An item cell holds up to 128 kinds of thing.

      Fluids go in a &6Fluid Cell Housing&r (a bucket where the hollow was) around the same matrices: a 4K fluid cell holds a thousand buckets of up to 32 fluids. A cell keeps its contents in the world, not on the item, and an empty cell comes apart again when you sneak-use it.

      &7Build a 64K Storage Cell and a 4K Fluid Cell.
    tasks: [{item: omnivault:storage_cell_64k}, {item: omnivault:fluid_cell_4k}]
    rewards: [{table: vaults_quartermaster}, {xp: 400}]

  - key: buses
    title: "In, Out and Through"
    subtitle: "The network's hands."
    icon: omnivault:import_bus
    pos: [7.5, 8.75]
    deps: [network_port, n_spoils/opener]
    desc: |
      Buses are Omnium and a Logic Processor around a hopper, a piston or a chest. An &6Import Bus&r pulls items and fluids out of what it faces; an &6Export Bus&r pushes them in; a &6Storage Bus&r makes that inventory part of the network, with a filter, a priority and an access mode.

      Old Pell's &6Bag Opener&r empties from the bottom. Put an Import Bus under it and everything the dead carried lands in the vault, sorted.

      &7Upgrade cards make devices better: Speed, Stack, Fuzzy, Redstone. Build one of each bus.
    tasks: [{item: omnivault:import_bus}, {item: omnivault:export_bus}, {item: omnivault:storage_bus}]
    rewards: [{item: omnivault:speed_upgrade}, {xp: 200}]

  - key: builders
    title: "Hands in the World"
    subtitle: "Mine into the vault, build out of it."
    icon: omnivault:destructor
    pos: [7.5, 10.5]
    deps: [buses]
    optional: true
    desc: |
      A &6Destructor&r mines the block in front of it into the network; a &6Constructor&r places blocks from it. Omnium and a Logic Processor around a diamond pickaxe or a dispenser.

      A cobblestone generator with a Destructor on its face never needs you again.

      &7Build both.
    tasks: [{item: omnivault:destructor}, {item: omnivault:constructor}]
    rewards: [{xp: 150}]

  - key: monitor
    title: "The Vault Talks Back"
    subtitle: "A number on a screen, a signal on a wire."
    icon: omnivault:storage_monitor
    pos: [12, 7]
    deps: [cell_drive]
    optional: true
    desc: |
      A &6Storage Monitor&r shows one item and its live count; right-click it to store or take. A &6Signal Emitter&r gives a redstone signal while the network holds at least (or fewer than) a number of something you choose. Wire it to a furnace line and the line stops when the shelves are full.

      &7Build a Storage Monitor and a Signal Emitter.
    tasks: [{item: omnivault:storage_monitor}, {item: omnivault:signal_emitter}]
    rewards: [{xp: 120}]

  # ---- autocrafting ----
  - key: patterns
    title: "Recipes Written Once"
    subtitle: "Patterns and the Provider."
    icon: omnivault:pattern_terminal
    pos: [12.5, 5.25]
    deps: [nexus]
    desc: |
      The Crown's treasurers wrote a recipe down once and never again. A &6Pattern Encoding Terminal&r (a Storage Terminal, an Advanced Processor, a crafting table and a Blank Pattern) writes one onto a &6Blank Pattern&r: a &6crafting pattern&r for a 3×3 recipe, or a &6processing pattern&r (up to nine inputs, three outputs) for a furnace, a Create machine or a Works crusher. JEI's &e+&r fills the editor for you.

      A &6Pattern Provider&r holds nine patterns and pushes processing inputs into the machine it faces.

      &7Build the encoding terminal, encode a crafting pattern and build a Pattern Provider.
