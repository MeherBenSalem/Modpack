chapter: n_spoils
group: chronicles
order: 52
title: "&dWhat the Dead Carry"
subtitle: "Mob LootBags: six tiers, four strange bags, two machines and a ragpicker."
icon: mob_loot_bags:legendarylootbag
quests:
  - key: start
    title: "&dWhat the Dead Carry"
    subtitle: "Their fingers only open at the end."
    icon: mob_loot_bags:commonlootbag
    pos: [0, 0]
    deps: [s1_act1_embers/spoils]
    shape: hexagon
    size: 1.5
    keeper: |
      The dead don't hoard gold. They hoard what they couldn't put down. Somebody has to pick it up.
    desc: |
      A letter, a ring, a loaf for a road that ended: when a Remnant falls, its fingers finally open. &6Old Pell&r, who picks the ash behind the shrine for whatever falls out, calls it spoils. &o"Everything the dead carry, they carried for a reason. Usually a bad one."&r

      &7Hostile monsters drop &6loot bags&7 when you kill them: about one kill in seven for something your size, more from bigger things, a quarter as often from spawner cages. Only your kills count (your pets' and arrows' too). Open one.
    tasks: [{advancement: "mob_loot_bags:open_bag"}]
    rewards: [{item: mob_loot_bags:commonlootbag, count: 3}, {xp: 50}]

  - key: tiers
    title: "Six Weights of Grief"
    subtitle: "Common to Mythic."
    icon: mob_loot_bags:rarelootbag
    pos: [2.5, 0]
    deps: [start]
    desc: |
      Six tiers: &fCommon&r, &aUncommon&r, &9Rare&r, &5Epic&r, &6Legendary&r, &dMythic&r. Out here they fall about 60, 26, 9.5, 3.5, 0.9 and 0.1 times in a hundred. Hold &eShift&r over a bag for its real odds, sampled from what this land put inside: runes, Tempering and Lustrous Stones, Remnant Shards, whetstones, tomes and food.

      &7Four bags of a tier craft into one of the next; one splits back into four. Hold use to open a bag, or sneak to open the whole stack. Craft a Rare bag from four Uncommons.
    tasks: [{item: mob_loot_bags:rarelootbag}]
    rewards: [{item: runeborn:faded_rune, count: 2}, {xp: 60}]

  - key: talisman
    title: "A Rabbit's Foot, Gilded"
    subtitle: "Luck you can carry."
    icon: mob_loot_bags:fortune_talisman
    pos: [2.5, -2.5]
    deps: [tiers]
    desc: |
      &6Bag Luck&r tilts every drop toward the better tiers. It comes from &6Looting&r on your weapon, your &6Luck&r, the size of what you killed, the Nether, the End and a hard world.

      A &6Fortune Talisman&r (an emerald, gold and a rabbit's foot) carried anywhere on you is a whole point of Bag Luck, and a quarter more bags besides. Pell's advice: luck can be trained too. The Tallyman's &6Exploration&r attribute is Luck by another name.

      &7Make a Fortune Talisman.
    tasks: [{advancement: "mob_loot_bags:fortune_talisman"}]
    rewards: [{item: minecraft:emerald, count: 4}, {xp: 80}]

  - key: opener
    title: "&eThe Bag Opener"
    subtitle: "Pell's fingers are older than the Eclipse."
    icon: mob_loot_bags:loot_bag_opener_block
    pos: [5, -1.75]
    deps: [tiers]
    shape: hexagon
    size: 1.25
    desc: |
      Pell would like a machine. A &6Bag Opener&r is iron, a hopper, redstone, an emerald and a chest: nine bags in, eighteen stacks out. Hoppers feed it from the top and sides and empty it from the bottom. It waits for Hourglass bags to ripen, and a comparator can read it.

      &7Four redstone modes: always on, on with a signal, on without one, or one bag per pulse. Build a Bag Opener.
    tasks: [{advancement: "mob_loot_bags:bag_opener"}]
    rewards: [{item: minecraft:hopper, count: 2}, {table: spoils_pells_cut}, {xp: 100}]

  - key: recycler
    title: "One Mob's Trash"
    subtitle: "Rotten flesh, ground into hope."
    icon: mob_loot_bags:loot_bag_recycle_block
    pos: [7.5, -3.5]
    deps: [opener]
    desc: |
      Rotten flesh, bones, string, arrows, feathers: every grave field leaves the same junk. A &6Loot Recycler&r (iron, a grindstone, smooth stone, a composter and redstone) grinds it into salvage points, and every &664 points&r becomes a fresh Common bag. Pearls, blaze rods, ghast tears and old weapons are worth more.

      Feed it bags you don't want and it keeps their experience until you take it.

      &7Build a Loot Recycler.
    tasks: [{advancement: "mob_loot_bags:loot_recycler"}]
    rewards: [{item: mob_loot_bags:commonlootbag, count: 4}, {xp: 80}]

  - key: hourglass
    title: "Worth the Wait"
    subtitle: "A promise the dead couldn't keep."
    icon: mob_loot_bags:timed_loot_bag
    pos: [7.5, -1.75]
    deps: [opener]
    optional: true
    desc: |
      An &6Hourglass&r bag is still keeping time for someone. Carry it five to ten minutes and it ripens into &5two bags of Epic or better&r, with a handful of bottled experience. The Bag Opener knows to wait for it.

      &7Three bags in a hundred are Hourglasses. Let one ripen and open it.
    tasks: [{advancement: "mob_loot_bags:open_hourglass"}]
    rewards: [{xp: 120}]

  - key: epic
    title: "Stones for the Smith"
    subtitle: "What tempering is made of."
    icon: mob_loot_bags:epiclootbag
    pos: [5, 0]
    deps: [tiers, n_runeborn/tempering]
    desc: |
      The Smith Under Ash tempers with what the dead leave behind, and the dead leave it in bags. &5Epic&r bags pay &6Tempering Stones&r V and VI, &6Lustrous Stones&r II and III, the six affinity &6whetstones&r, Radiant runes and Sovereign Fragments. Rare bags carry the lower stones; Legendary the higher ones.

      &o"I don't ask where you found them,"&r says the Smith. &o"I ask how many."&r

      &7Open an Epic Loot Bag.
    tasks: [{advancement: "mob_loot_bags:open_epic"}]
    rewards: [{item: runeborn:tempering_stone_3, count: 2}, {xp: 150}]

  - key: legendary
    title: "&6Jackpot"
    subtitle: "Somebody held on very hard."
    icon: mob_loot_bags:legendarylootbag
    pos: [7.5, 0]
    deps: [epic]
    shape: hexagon
    size: 1.25
    desc: |
      Legendary bags come from the dead who held on hardest. They pay &6Hero's runes&r, Tempering Stones VII and VIII, Lustrous Stones IV to VI, &6Tomes of Ascension&r, a Tear of Rebirth, and now and then a Hallowed Tear or a Sunseed. The whole world hears when one drops.

      Bad luck runs out. Twelve kills without a bag and the next one drops one; twenty bags below Rare and the next is Rare; two hundred without a Legendary and the next is &6Legendary&r.

      &7Open a Legendary Loot Bag.
    tasks: [{advancement: "mob_loot_bags:open_legendary"}]
    rewards: [{table: spoils_pells_cut}, {item: runeborn:lustrous_rune, count: 2}, {xp: 300}]

  - key: locked
    title: "Safecracker"
    subtitle: "Sealed by someone who meant to come back."
    icon: mob_loot_bags:locked_lootbags
    pos: [5, 1.75]
    deps: [tiers, n_measure/first_point]
    desc: |
      Cut a &6Diamond Key&r from a diamond on a stonecutter. It is used up, and it only has to be somewhere on you. Inside a &bLocked&r bag is the old world's best: always one piece of enchanted &5netherite&r gear, and two or three of netherite ingots, diamonds, ancient debris, a smithing template, a totem or a golden apple.

      Netherite won't answer a weak hand. Read the gear's lock, then the Tallyman's &eK&r screen, before you get excited.

      &7One bag in a hundred comes out Locked. Cut a key and open one.
    tasks: [{item: mob_loot_bags:diamond_key}, {advancement: "mob_loot_bags:open_locked"}]
    rewards: [{item: minecraft:diamond}, {xp: 150}]

  - key: cursed
    title: "Tempting Fate"
    subtitle: "Something packed this bag with a grudge."
    icon: mob_loot_bags:cursed_lootbag
    pos: [5, 3.5]
    deps: [tiers]
    optional: true
    desc: |
      A &cCursed&r bag rolls the dice when you open it. Half the time three to five &ccursed&r monsters rise around you, glowing, and each one you kill drops a bag of its own. Sometimes it's a &6Legendary&r jackpot. Sometimes a hex that lasts twelve seconds. Sometimes something stranger.

      &7Two bags in a hundred come out Cursed. Open one with your back to a wall.
    tasks: [{advancement: "mob_loot_bags:open_cursed"}]
    rewards: [{xp: 100}]

  - key: summoning
    title: "Pocket Bestiary"
    subtitle: "The dead carry their grudges too."
    icon: mob_loot_bags:summoning_lootbags
    pos: [7.5, 3.5]
    deps: [cursed]
    optional: true
    desc: |
      A &6Summoning&r bag is a sack of spawn eggs: zombies, skeletons, creepers, spiders, slimes, a ghast if the dead disliked you. Open it somewhere with a door you can close.

      &7Open a Summoning Loot Bag.
    tasks: [{advancement: "mob_loot_bags:open_summoning"}]
    rewards: [{xp: 80}]

  - key: finale
    title: "&dMyth Made Real"
    subtitle: "One bag in a thousand."
    icon: mob_loot_bags:mythiclootbag
    pos: [10.5, 0]
    deps: [legendary]
    shape: gear
    size: 2.0
    desc: |
      One bag in a thousand is &dMythic&r, or you make one from four Legendaries and a &6nether star&r. Every boss this land knows (the Old Powers, the Cataclysm's monsters, the Realm's wardens and the rest) drops three bags of Epic or better when it dies, each with a fifteen-in-a-hundred chance of Mythic. Inside: Sovereign runes, Lustrous Stones VII to IX, Sovereign stones, Tomes of Ascension.

      Pell turns the empty bag over in his hands. &o"Someone carried this all the way down. Wonder what they meant to buy with it."&r He sells the stories to the Archivist; the bags he keeps.

      &7Open a Mythic Loot Bag.
    tasks: [{advancement: "mob_loot_bags:open_mythic"}]
    rewards: [{table: spoils_pells_cut}, {item: runeborn:radiant_rune, count: 2}, {xp: 1000}]
