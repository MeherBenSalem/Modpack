chapter: s1_act3_deep
group: main
order: 3
title: "&6Act III: &fThe Deep"
subtitle: "Drowned skies, buried cities, the Old Powers. Levels 30–50."
icon: minecraft:echo_shard
shape: rsquare
quests:
  - key: descent
    title: "&6The Deep"
    subtitle: "The dark was here before the Eclipse."
    icon: minecraft:sculk_shrieker
    deps: [s1_act2_hunt/sylvara]
    shape: hexagon
    size: 2.0
    desc: |
      &o"There are things older than the Sovereigns, Ashborn. They never served the Crown. They keep relics of the world before, and they don't share."&r

      The Old Powers: the &6Warden&r below, the &6Elder Guardian&r beneath the sea, the &6Wither&r and the &6Dragon&r. Each keeps a &6Relic&r. Start in the deep dark.
    tasks: [{structure: "minecraft:ancient_city"}]
    rewards: [{table: hunters_spoils}, {xp: 300}]

  - key: warden
    title: "&5The Listener"
    subtitle: "Old Power: the Warden."
    icon: runeborn:relic_warden
    deps: [descent]
    shape: gear
    size: 1.75
    desc: |
      It's blind. It hears your heartbeat. It hits harder than anything you've met.

      You don't have to fight it fair. Its Relic becomes &6Shadowfang&r, the dagger that strikes from where you are not.
    tasks: [{kill: minecraft:warden}, {item: runeborn:relic_warden}]
    rewards: [{table: sovereign_tribute}, {xp: 800}]

  - key: otherside
    title: "The Otherside"
    subtitle: "Below the deep dark, something deeper."
    icon: deeperdarker:heart_of_the_deep
    deps: [descent]
    optional: true
    desc: |
      Some ancient cities hide a portal frame of reinforced sculk. Beyond it lies the &5Otherside&r, an echo of a world the Wardens remember. The &5Stalker&r hunts there.
    tasks: [{dimension: "deeperdarker:otherside"}]
    rewards: [{table: hunters_spoils}, {xp: 400}]

  - key: monument
    title: "&5The Drowned Keeper"
    subtitle: "Old Power: the Elder Guardian."
    icon: runeborn:relic_elder_guardian
    deps: [descent]
    shape: gear
    size: 1.5
    desc: |
      Deep in the ocean monuments, three Elder Guardians keep the sea's oldest secret and curse anyone who tries to learn it. Kill one and take its Relic.
    tasks: [{structure: "betteroceanmonuments:ocean_monument"}, {kill: minecraft:elder_guardian}]
    rewards: [{table: hunters_spoils}, {xp: 500}]

  - key: drowned_sky
    title: "The Drowned Sky"
    subtitle: "Kaelthar spoke to the storm."
    icon: minecraft:lightning_rod
    deps: [monument]
    desc: |
      &6Kaelthar the Stormcaller&r, Sovereign of the Drowned Sky, drowned his own coast to keep the storm for himself. His token is a &6lightning rod&r.

      &7Before him, the drowned coast has other things to fight: a sunken city with a Leviathan, a kraken's ship, a frozen pirate captain. None is required. All of them will teach you about water.
    tasks: [{item: minecraft:lightning_rod}, {item: runeborn:sovereign_fragment, count: 6}]
    rewards: [{item: minecraft:trident}, {xp: 200}]

  - key: leviathan
    title: "The Leviathan"
    subtitle: "The sunken city is not empty."
    icon: cataclysm:tidal_claws
    deps: [drowned_sky]
    optional: true
    shape: gear
    desc: |
      Under the ocean lies a &3sunken city&r, and in it something vast that drags its prey into the abyss. Bring water breathing. Bring friends.
    tasks: [{kill: cataclysm:the_leviathan}]
    rewards: [{table: sovereign_tribute}, {xp: 800}]

  - key: kraken
    title: "The Kraken's Ship"
    subtitle: "A wreck that still has a captain."
    icon: block_factorys_bosses:kraken_tooth
    deps: [drowned_sky]
    optional: true
    shape: gear
    tasks: [{kill: block_factorys_bosses:kraken}]
    rewards: [{table: hunters_spoils}, {xp: 600}]

  - key: kaelthar
    title: "&6Sovereign: Kaelthar the Stormcaller"
    subtitle: "Sovereign of the Drowned Sky. Level 30."
    icon: runeborn:storm_totem
    deps: [drowned_sky]
    shape: gear
    size: 2.0
    desc: |
      He calls lightning down where you stand. Keep moving, never stand still for a whole breath, and never fight him in the rain if you can help it.
    tasks: [{item: runeborn:sigil_kaelthar}, {advancement: "runeborn:feats/fell_kaelthar"}]
    rewards: [{table: sovereign_tribute}, {item: runeborn:tempering_stone_6, count: 2}, {xp: 900}]

  - key: ancient_remnant
    title: "&cThe Ancient Remnant"
    subtitle: "Older than Ossukage. Older than the Crown."
    icon: cataclysm:wrath_of_the_desert
    deps: [descent]
    shape: gear
    size: 1.75
    desc: |
      The Hollow Sovereign's warrior, Ossukage, likes to call himself the first Remnant. He's wrong.

      Somewhere under the desert sand sleeps a pharaoh-thing that rose again before there was a Crown to serve: the &cAncient Remnant&r. Wake it. Then survive it.
    tasks: [{kill: cataclysm:ancient_remnant}]
    rewards: [{table: sovereign_tribute}, {xp: 1000}]

  - key: cursed_keep
    title: "The Cursed Keep"
    subtitle: "Tier III of the dungeon trail."
    icon: minecraft:soul_lantern
    deps: [s1_act2_hunt/spire]
    desc: |
      In the hot, wet places stands the &6Cursed Keep&r. Its Warlord died long ago. He didn't notice.
    tasks: [{advancement: "muchmoredungeons:slay_dungeon_t2_guardian"}]
    rewards: [{table: hunters_spoils}, {xp: 400}]

  - key: abyssal_halls
    title: "The Abyssal Halls"
    subtitle: "The deepest Labyrinth."
    icon: minecraft:deepslate_bricks
    deps: [s1_act2_hunt/labyrinth, descent]
    optional: true
    tasks: [{advancement: "muchmoredungeons:slay_deepslate_halls_guardian"}]
    rewards: [{table: hunters_spoils}, {xp: 500}]

  - key: scarlet_garden
    title: "The Scarlet Garden"
    subtitle: "Ysolde grew flowers in blood."
    icon: minecraft:redstone_block
    deps: [kaelthar]
    desc: |
      &6Ysolde, the Crimson Bloom&r, Sovereign of the Scarlet Garden, fed her garden on her own court. Her token is a &cblock of redstone&r, the colour of everything she ever loved.
    tasks: [{item: minecraft:redstone_block}, {item: runeborn:sovereign_fragment, count: 6}]
    rewards: [{item: minecraft:golden_apple, count: 3}, {xp: 200}]

  - key: ysolde
    title: "&6Sovereign: Ysolde, the Crimson Bloom"
    subtitle: "Sovereign of the Scarlet Garden. Level 35."
    icon: runeborn:crimsonfall
    deps: [scarlet_garden]
    shape: gear
    size: 2.0
    desc: |
      She bleeds you. &cHemorrhage&r builds with every cut and bursts for a share of your health. Don't let her chain combos; one clean roll beats three panicked ones.

      &o"Four embers. Half the sun. Look up tonight, Ashborn. Tell me you can't see it."&r
    tasks: [{item: runeborn:sigil_ysolde}, {advancement: "runeborn:feats/fell_ysolde"}]
    rewards: [{table: sovereign_tribute}, {item: runeborn:lustrous_stone_4, count: 2}, {xp: 1000}]
