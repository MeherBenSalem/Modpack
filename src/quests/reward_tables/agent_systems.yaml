    - {item: mob_loot_bags:uncommonlootbag, count: 2, weight: 3}
    - {item: mob_loot_bags:rarelootbag, count: 1, weight: 1}
    - {item: remnant_mobs:remnant_shard, count: 3, weight: 2}
    - {item: runeborn:faded_rune, count: 3, weight: 2}
    - {item: runeborn:tempering_stone_2, count: 2, weight: 2}
    - {item: runeborn:lustrous_rune, count: 1, weight: 1}

