# Reward tables for The Vaults (h_vaults, OmniVault expansion), The Measure (n_measure, RPG Stats) and
# What the Dead Carry (n_spoils, Mob LootBags). Keys are prefixed with their chapter's name.
# {table: key} rolls one entry by weight. No netherite, Hallowed Tears, Sunseeds, seals or Ember alloys; no bag above
# Rare (Epic and better bags can roll Sunseeds and Hallowed Tears).

vaults_quartermaster:
  title: "The Quartermaster's Shelf"
  icon: omnivault:omnium_ingot
  rewards:
    - {item: omnivault:omnium_ingot, count: 4, weight: 3}
    - {item: omnivault:logic_processor, count: 2, weight: 2}
    - {item: omnivault:upgrade_base, count: 2, weight: 2}
    - {item: omnivault:blank_pattern, count: 4, weight: 2}
    - {item: omnivault:nexus_cable, count: 16, weight: 2}
    - {item: omnivault:speed_upgrade, count: 1, weight: 1}
    - {item: omnivault:stack_upgrade, count: 1, weight: 1}

spoils_pells_cut:
