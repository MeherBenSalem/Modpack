# RPG Stats gates (Remnants: RPG Stats, Skills & Progression). Compiled by tools/build_stat_locks.py into
# pack/config/ras/items_lock.json, blocks_lock.json and levelup_rewards.json, with every id checked.
#
# An item lock needs points in one attribute (the K screen): a locked weapon can't strike, a locked tool can't break
# blocks, locked armour can't be worn, a locked item can't be used. A block lock needs an overall RPG level to mine.
# The thresholds follow the acts so they read as "you are ready for this now", never as a wall: a player who spends
# points evenly passes each one at about the act where the item first shows up.
#
#   Act I  (levels 5-15):  up to 6      Act II (15-30): 8-14      Act III (30-50): 14-24
#   Act IV (50-70):        24-32        Act V  (70+):   32-40
#
# Attributes: 1 Vitality, 2 Attack Power, 3 Attack Speed, 4 Protection, 5 Agility, 6 Fortitude, 7 Toughness,
# 8 Exploration.

attributes: {vitality: 1, attack_power: 2, attack_speed: 3, protection: 4, agility: 5, fortitude: 6, toughness: 7,
             exploration: 8}

