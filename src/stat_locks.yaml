# What a level-up pays: the pack's own economy instead of RPG Stats' default diamonds and diamond armour (which
# skipped the Ember Forge and the gear locks). Runes every level, a tempering stone every 5, a lustrous stone every 10.
levelup_rewards:
  max_level: 100
  every_level: {item: runeborn:faded_rune, count_per_10_levels: 1}      # 1 at 1-9, 2 at 10-19, ...
  every_5: {item_tiers: [runeborn:tempering_stone_1, runeborn:tempering_stone_2, runeborn:tempering_stone_3,
                         runeborn:tempering_stone_4, runeborn:tempering_stone_5, runeborn:tempering_stone_6,
                         runeborn:tempering_stone_7, runeborn:tempering_stone_8]}   # tier = level // 13 + 1
  every_10: {item_tiers: [runeborn:lustrous_stone_1, runeborn:lustrous_stone_2, runeborn:lustrous_stone_3,
                          runeborn:lustrous_stone_4, runeborn:lustrous_stone_5, runeborn:lustrous_stone_6,
                          runeborn:lustrous_stone_7, runeborn:lustrous_stone_8, runeborn:lustrous_stone_9]}  # tier = level // 11
