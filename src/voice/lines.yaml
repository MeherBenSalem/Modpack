# Generated by tools/build_quests.py from the quests' keeper/whisper text and extra_lines.yaml.
# Record each line as src/voice/raw/<line>.mp3, then run tools/build_voice.py.
s1_prologue_rise:
  speaker: keeper
  text: 'Another one. Up you get. The ash doesn''t keep its dead for long.


    Listen, because I''ll only say it once. Once there was a sun, and a crown to hold its light. Seven rulers swore to share it, so they broke the sun into pieces and each carried one home. An eighth wanted all of it. He drank the last light himself, and the sky went black.


    Since then, nothing that dies here stays dead. It comes back wrong. Remnants, we call them. And you came back too, little ember. That makes you the brightest thing left in the world. They will want it. Let''s not give it to them.'
s1_prologue_gatekeeper:
  speaker: keeper
  text: Odric kept this gate for the heralds. Kept it well. When the heralds died, nobody told him to stop.
s1_prologue_beyond:
  speaker: keeper
  text: Up the stair. Through the gate. Don't look back; there's nothing behind you but graves, and one of them was yours.
s1_prologue_origin:
  speaker: keeper
  text: You had a life before the ash. Most of you remember a sword, or a prayer, or a debt. Pick the one that feels true. It won't matter to the dead.
s1_prologue_stone:
  speaker: keeper
  text: Stone. Good. Stone doesn't care what you were, either.
s1_prologue_stamina:
  speaker: keeper
  text: You're not strong yet. So don't be there when it lands.
s1_prologue_first_blood:
  speaker: keeper
  text: Don't look at their faces. Some of them used to be someone's.
s1_prologue_runes:
  speaker: keeper
  text: Feel that? A little warmth, where there wasn't any. That was theirs. Now it's yours. Don't lose it.
s1_prologue_you_died:
  speaker: keeper
  text: Good. Now you know. Everyone dies once. The trick is not to make a habit of it. Go back to where you fell. Something is wearing your face, and it is holding your light.
s1_prologue_reclaimed:
  speaker: keeper
  text: Strange, killing yourself. It gets easier. That should worry you more than it does.
s1_prologue_armour:
  speaker: keeper
  text: Armour doesn't make you brave. It makes you stupid for a little longer, which is nearly the same thing.
s1_prologue_night:
  speaker: keeper
  text: Nights are longer than they used to be. Or we are smaller. Light a fire and don't argue with the dark.
s1_prologue_know_enemy:
  speaker: keeper
  text: Some of them have died more than once. Each time they come back meaner. Count the crests before you count your chances.
s1_prologue_village:
  speaker: keeper
  text: There. Smoke. People, and people who stayed small and stayed lit. Take me there, Ashborn. Fire wants company, and so, I'm told, do I.
s1_act1_embers_tale_seven:
  speaker: keeper
  text: 'Sit. The fire is listening, so I''ll keep it short.


    The seven who broke the sun were not monsters, at first. A rider who kept the hours. A king with too many arms. A queen of frost, a lord of storms, a gardener, a burning king, and a wyrm-rider at the edge of the world.


    Each took a piece of the light home and swore to bring it back when the Crown called. The Crown never called. The Eighth drank what was left, and the seven went mad in the dark, clutching their scraps of sun like misers.


    Gather their Fragments. Make a sigil. Wake them. And take back the light they never returned.'
s1_act1_embers_kindling:
  speaker: keeper
  text: Campfire for the heart. Gold for the oath. Deepslate for the bones. And old flame, the kind nothing in this world makes any more. Here. I kept some.
s1_act1_embers_kindle:
  speaker: keeper
  text: There. Do you see it? First fire in an age that wasn't stolen. Last Light, we'll call this place. The dark can count, Ashborn. Let's give it a number it doesn't like.
s1_act1_embers_level_up:
  speaker: keeper
  text: Light hoarded is light wasted. The Sovereigns learned that too late. Spend yours.
s1_act1_embers_travel:
  speaker: keeper
  text: One fire is a home. Two fires is a road. Ten fires, and the dark starts to feel crowded.
s1_act1_embers_sellsword:
  speaker: keeper
  text: The Company? Survivors. They stayed together and they stayed paid, which is more than the Sovereigns managed.
s1_act1_embers_spoils:
  speaker: keeper
  text: The dead keep pockets. Habit, I think. Nobody tells them they can't take it with them.
s1_act1_embers_dungeon_trail:
  speaker: keeper
  text: Every guardian carries a map to someone worse. Nobody knows who started the chain. Nobody's reached the end and come back to say.
s1_act1_embers_champion:
  speaker: keeper
  text: When a Sovereign went mad, its champions went with it. They still carry their master's light. Take it back.
s1_act1_embers_fragments:
  speaker: keeper
  text: The Dusk Rider kept the hours for the Crown. When the sun went out, he stopped his clock at that minute, and he has been riding at that minute ever since.
s1_act1_embers_dusk_rider:
  speaker: keeper
  text: One ember. Look at it, Ashborn. The first light in an age that came back on its own. Every Ashborn on this world just felt their heart beat a little stronger. That was you. The dark felt it too. It will send something worse.
s1_act1_embers_relic:
  speaker: keeper
  text: The Smith can make something of that. He says the Rider's glaive still keeps time, if you listen.
s1_act2_hunt_tale_red_moon:
  speaker: keeper
  text: 'You heard the bell last night. You''ll hear it again.


    When the sun went out, the moon kept its light for a while. The old priests called it the Hunter''s Moon: the night the Crown''s huntsmen rode out to clear the roads. The huntsmen are Remnants now. On certain nights the moon remembers them, and turns the colour of what they hunted.


    On those nights everything that has died before wakes hungrier. They''ll find you, Ashborn. Your light is a beacon, and a red moon lets the dead see further.


    So hunt back. Varghast waits beyond the hunt, and the Frost Matron beyond him. Two more embers. Go and take them.'
s1_act2_hunt_hunters_moon:
  speaker: keeper
  text: Toll's ringing. Bar the doors, sharpen something, and don't stand near the windows. Or go out there. You were always going to go out there.
s1_act2_hunt_grim_vigil:
  speaker: keeper
  text: Some nights the huntsmen don't wait for a red moon. They choose. They learn your name, they take your trail, and they come in threes until the sky goes grey. The last one through the trees will be the one who taught the others. Keep your back to a wall and your eyes on the dawn. It always comes. That's the one promise the dark never broke.
s1_act2_hunt_kindled:
  speaker: keeper
  text: You found one. A Vital Ember. When the sun broke, a little of it fell into everything that was alive to catch it. The dead keep theirs a long time. Take it in, Ashborn. It will make your heart a little bigger, and it won't give the room back when you die.
s1_act2_hunt_punching_up:
  speaker: keeper
  text: 'The Company has a saying: pick on someone your own size, and you''ll stay that size forever.'
s1_act2_hunt_challenge:
  speaker: keeper
  text: You're branding them now? On purpose? I've buried braver people than you. Well. Not buried. You know what I mean.
s1_act2_hunt_remnant:
  speaker: keeper
  text: That horn means one of them has your scent. Don't run. They're faster, and they've done this before.
s1_act2_hunt_labyrinth:
  speaker: keeper
  text: The Sovereigns couldn't kill everything they feared. So they dug.
s1_act2_hunt_path:
  speaker: keeper
  text: Your runes have opinions now. Listen to them. A blade, a star, a prayer. Pick one before the dark picks for you.
s1_act2_hunt_varghast_fragments:
  speaker: keeper
  text: Varghast was a good king, once. Too good. He couldn't bear to lose a single soldier, so he kept them. Every arm of every man who fell for him, sewn onto his own.
s1_act2_hunt_varghast:
  speaker: keeper
  text: Two embers. When he fell, I heard them. All those soldiers, finally let go. Some of them were saying thank you, Ashborn. I think one of them was saying it to you.
s1_act2_hunt_crown:
  speaker: keeper
  text: The Crown was made to hold the sun. Every piece still remembers how. Wear it, and it will try to hold you.
s1_act2_hunt_rime_veil:
  speaker: keeper
  text: Sylvara buried her piece of the sun under the snow to keep it from melting away. It worked. Nothing there has melted in an age, including her.
s1_act2_hunt_sylvara:
  speaker: keeper
  text: Three embers. Feel that wind? It's warm. For the first time in an age, something in the north is thawing. Three Sovereigns, Ashborn. You're making the dark nervous.
s1_act2_hunt_runebearer:
  speaker: keeper
  text: Fifty levels of light. You glow, you know. Not so anyone else could see. But I can.
s1_act3_deep_tale_old_powers:
  speaker: keeper
  text: 'Some things are older than the Crown, Ashborn. Older than the sun, maybe.


    The Warden in the deep dark, who listens for heartbeats. The Drowned Keeper under the sea. The Wither, which is only hunger with three mouths. And the Dragon at the edge of the world. They never knelt to the Crown, and the Sovereigns were wise enough to leave them alone.


    Each of them keeps a relic of the world before. Not light, exactly. Memory. What the world was like when it was young.


    You''ll need that memory where you''re going. The storm-lord waits beneath the waves, and the gardener behind her roses. Go down. The deep has been waiting for someone to bother it.'
s1_act3_deep_descent:
  speaker: keeper
  text: Quiet down there. Not the polite kind. The kind that is listening back.
s1_act3_deep_warden:
  speaker: keeper
  text: It can't see you. It doesn't need to. Every heart is a drum to it, and yours is louder than most.
s1_act3_deep_monument:
  speaker: keeper
  text: The sea kept a secret for the world. Three old things guard it, and they curse anyone who swims too close. Swim close.
s1_act3_deep_drowned_sky:
  speaker: keeper
  text: 'Kaelthar was afraid of the dark, so he kept the one thing that still flashed: lightning. He drowned his own coast to keep the storm close. Every bolt you see out there is him, still talking to it.'
s1_act3_deep_kaelthar:
  speaker: keeper
  text: Four embers. Listen. No thunder. For the first time in an age, the sea is just the sea. Halfway, Ashborn. Halfway home.
s1_act3_deep_ancient_remnant:
  speaker: keeper
  text: Before the Crown, there was a king of sand who refused to die. He was the first. Everything rising out there learned it from him.
s1_act3_deep_scarlet_garden:
  speaker: keeper
  text: Ysolde loved her garden more than her court. When the sun went out, the flowers started dying, so she fed them. First the servants. Then the court. Then herself, a little, every day.
s1_act3_deep_ysolde:
  speaker: keeper
  text: Five embers. More than half the sun. Look up tonight, Ashborn. The sky is not black any more. It's dark blue. Tell me you can't see it.
s1_act4_ash_tale_burning_crown:
  speaker: keeper
  text: 'Down there, the ash is still falling. Do you know what it is?


    Morgrath was the proudest of the seven. When he saw the others going mad, he swore no one would rule his kingdom after him. So he burned it. Every field, every hall, every soul who called him king. When it was done, he sat on the ashes and called himself their Sovereign.


    The ash you''ll breathe down there was his people, Ashborn. Breathe gently.


    Past him, beyond the eye of the world, there is a shore where a drop of the sun fell when the Eighth drank it. The Dragon guards it, and Vaelorn, the last of the seven, guards the Dragon. Two more embers. Then the black sun.'
s1_act4_ash_ashlands:
  speaker: keeper
  text: Hot, isn't it? He wanted it to stay warm forever. Be careful what you wish for when you wear a crown.
s1_act4_ash_soulfire_crypt:
  speaker: keeper
  text: The end of the trail. The Archivist owes me a drink. I said someone would make it.
s1_act4_ash_wither:
  speaker: keeper
  text: Three skulls and the sand of lost souls. That's not a summoning, Ashborn, it's a dinner bell.
s1_act4_ash_morgrath:
  speaker: keeper
  text: Six embers. Down there, for the first time in an age, the ash has stopped falling. His people can rest now. Maybe he can too.
s1_act4_ash_stronghold:
  speaker: keeper
  text: Follow the eyes. They know where the edge is. They've been trying to get back there since the sky went dark.
s1_act4_ash_last_shore:
  speaker: keeper
  text: When the Hollow Sovereign drank the sun, a drop of it spilled off the edge of the world. It landed there. The Dragon has been guarding it ever since, and it doesn't know why.
s1_act4_ash_dragon:
  speaker: keeper
  text: Catch its breath before it dies. That breath was sunlight, once. Vaelorn will smell it on you.
s1_act4_ash_vaelorn:
  speaker: keeper
  text: Seven embers. All seven. Do you know how long I waited to say that? One light left, and it isn't in this world. Rest first, Ashborn. Then we find the black sun.
s1_act4_ash_crown_remade:
  speaker: keeper
  text: Put it down, Ashborn. It doesn't fit anyone. That was always the problem.
s1_act5_realm_tale_eighth:
  speaker: keeper
  text: 'I knew him, you know. Before.


    He wasn''t a king. He was a herald, one of the ones who carried the flame between the seven and never kept any for himself. When they broke the sun, they forgot him. No Fragment for the herald. No crown.


    So he took what was left. All of it. He drank the last of the sun and walked behind it, into the black, and the light went out inside him the moment he swallowed it. A crown with nothing inside.


    He''s still sitting there, on his throne, under the sun he ate, waiting for someone to tell him it was worth it. It wasn''t. Go and tell him.'
s1_act5_realm_shard:
  speaker: keeper
  text: 'Seven Sovereigns, seven embers. The eighth light is where he took it: behind the black sun. You''ll need a door.'
s1_act5_realm_enter:
  speaker: keeper
  text: I can't follow you in, Ashborn. Nothing living can, and I'm not sure I count as living any more. Come back with the light. I'll keep the fire going.
s1_act5_realm_hollow_sovereign:
  speaker: keeper
  text: 'It''s done. Eight embers. Can you feel it? The light is coming back the way it left: all at once. Come home, Ashborn. Come and see the sun.'
s1_epilogue_first_light:
  speaker: keeper
  text: 'Look at that. Go on, look. I''d almost forgotten the colour.


    Every ember you rekindled is still burning, and every Ashborn on this world carries a heart for each one. The dead are lying down, Ashborn. Not all of them. Most. The ones still walking out there are just stubborn, like the rest of us.


    Rest now. The sun remembers you. It remembers all of us, I think. Even the ones who don''t deserve it.'
s1_epilogue_homecoming:
  speaker: keeper
  text: The Smith is singing. Badly. The Company's captain is pretending not to cry. Come home, Ashborn. Somebody saved you a seat by the fire, though I suppose you don't need the fire any more.
s1_epilogue_keepers_name:
  speaker: keeper
  text: 'You never asked my name. Nobody does. I''ll tell you anyway, since you''ve earned it: I don''t have one. Heralds didn''t. We had a title, a flame and a road.


    I carried the first flame to the forge where the Crown was made. I watched them break the sun into pieces, and I said nothing. That''s my share of all this.


    After, I kept a little of the old flame. Just in case. I gave it to you.'
s1_epilogue_who_broke_the_sun:
  speaker: whisper
  text: Seven crowns. One hollow. A herald who kept a little flame for later. You were all so busy with the pieces. Not one of you asked who cracked the sun first.
s1_epilogue_ascendant:
  speaker: keeper
  text: A hundred levels. You could carry a Sovereign's share of light now, and not go mad from it. Probably.
s1_act1_embers_dusk_rider_unlock:
  speaker: keeper
  text: The Sigil's warm. He'll feel it. Wait for dusk, stand somewhere open, and hold it up. The Dusk Rider has ridden the same road every evening for an age. Tonight it goes through you. Don't run from the horse, Ashborn. Roll through it.
s1_act2_hunt_varghast_unlock:
  speaker: keeper
  text: Iron and six Fragments. That's enough to wake him. Varghast will come with every arm he ever took. Don't trade blows with a man who has a hundred of them. Make his Sigil, find somewhere wide, and call.
s1_act2_hunt_sylvara_unlock:
  speaker: keeper
  text: Blue ice and six Fragments. Sylvara will know you're coming before you do. Dress warm, and keep a flask for when the frost bursts. She was gentle, once. She won't be tonight.
s1_act3_deep_kaelthar_unlock:
  speaker: keeper
  text: You have it. The rod, the Fragments. Kaelthar will hear his Sigil the way he hears thunder. Pick a dry day if the sky allows it, and never stand still under him. Not even to breathe.
s1_act3_deep_ysolde_unlock:
  speaker: keeper
  text: Redstone and six Fragments. Red was always her colour. Ysolde will cut you a hundred small times and wait for you to fall over. Don't let her dance. One clean roll, then answer.
s1_act4_ash_morgrath_unlock:
  speaker: keeper
  text: The scrap is still warm. So is he. Morgrath fights in the fire that ended his kingdom, and the fire has never once minded him. Bring something to cool your blood, and don't stand where the ground glows.
s1_act4_ash_vaelorn_unlock:
  speaker: keeper
  text: Dragon's breath, in a bottle. That was sunlight, once. Vaelorn will smell it from the edge of the world and come to take it back. Open ground, Ashborn, and never in front of him. He rides like the last of something.
s1_act5_realm_hollow_sovereign_unlock:
  speaker: keeper
  text: The Seal is made. The altar in the Hollow Citadel is waiting for it, and so is he. He won't think you came to kill him. He'll think you came to kneel. Show him otherwise.
threshold_gate:
  speaker: keeper
  text: Fog. Beyond it, Odric. He kept this gate for the heralds when they lived, and he keeps it for the dead now. He was told not to let anyone leave. He has never once been told to stop.
threshold_fell:
  speaker: keeper
  text: Not yet. That's all right. Nobody passes Odric the first time. The Ember Door in the crypt will open for you now. Go around him, or go back through him. Either way, go.
threshold_victory:
  speaker: keeper
  text: There. You see? You can be killed, and you can still win. Remember that, when the big ones come. Odric can rest now. Climb the stair, Ashborn. The world is waiting, and it isn't patient.
threshold_beyond:
  speaker: keeper
  text: There it is. The world, or what the dark left of it. Walk toward the smoke. Someone out there kept a fire lit.
